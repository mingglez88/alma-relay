name: Sync upstream

# 每天 10:00（北京时间）检查上游 yetone/alma-relay 是否有新提交，
# 有则合并到 main，Workers Builds 随后自动部署。
# 也可在 Actions 页手动点 Run workflow 立即同步一次。
# 合并冲突时工作流直接失败、不强推，需手动处理。
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/yetone/alma-relay.git
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit
      - name: Push to origin
        run: git push origin main
